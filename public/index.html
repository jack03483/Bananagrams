<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bananagrams</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <h1>🍌 Bananagrams</h1>
      <div id="game-info">
        <span id="tile-count">Board: 0 / 100</span>
        <span id="pool-count">Pool: 129</span>
        <span id="status-msg"></span>
      </div>
    </header>

    <div id="main-layout">
      <div id="game-area">
        <div id="board-container">
          <div id="board"></div>
        </div>
        <div id="rack-area">
          <div id="rack-label">Your Tiles <span id="rack-count"></span>
            <button id="main-swap-btn" class="main-swap-btn">Swap 1→3</button>
          </div>
          <div id="rack"></div>
        </div>
      </div>

      <div id="sidebar">
        <div id="sidebar-header">
          <h2>Possible Words</h2>
          <div id="word-count-label">Loading...</div>
        </div>
        <div id="word-list"></div>
      </div>
    </div>

    <!-- DEV: remove before push -->
    <button id="dev-skip-btn" style="position:fixed;bottom:10px;left:10px;z-index:9999;padding:6px 12px;background:#440000;color:#aa4444;border:1px solid #660000;border-radius:4px;font-size:0.7rem;cursor:pointer;opacity:0.6;">DEV: Skip to Boss</button>

    <canvas id="confetti-canvas"></canvas>

    <!-- PEEL -->
    <div id="peel-overlay" class="overlay hidden">
      <div class="peel-text">PEEL! +15</div>
    </div>

    <!-- Victory -->
    <div id="victory-screen" class="overlay hidden">
      <div class="victory-content">
        <div class="victory-title">VICTORY!</div>
        <div id="victory-sub-text" class="victory-sub"></div>
      </div>
    </div>

    <!-- Boss Reveal -->
    <div id="boss-reveal" class="overlay hidden">
      <img src="boss.png" alt="" class="boss-reveal-img">
    </div>

    <!-- Boss Battle -->
    <div id="boss-battle" class="overlay hidden">
      <div class="boss-battle-content">
        <div class="boss-header">
          <div id="boss-level-display" class="boss-level">Level 1</div>
          <span id="boss-timer">5:00</span>
          <div id="boss-min-word-len" class="boss-min-len"></div>
        </div>
        <div class="boss-hud">
          <div class="boss-combatant">
            <div class="boss-name-enemy">Boss</div>
            <div class="boss-hp-bar"><div id="alun-hp-fill" class="boss-hp-fill alun-hp"></div></div>
            <div id="alun-hp-text" class="boss-hp-text"></div>
          </div>
          <div class="boss-vs">VS</div>
          <div class="boss-combatant">
            <div class="boss-name-player">You</div>
            <div class="boss-hp-bar"><div id="player-hp-fill" class="boss-hp-fill player-hp-boss"></div></div>
            <div id="player-hp-text-boss" class="boss-hp-text"></div>
          </div>
        </div>
        <div id="boss-feedback" class="boss-feedback"></div>
        <div class="boss-letters-area">
          <div class="boss-letters-label">Your Letters (<span id="boss-letter-count">50</span>):</div>
          <div id="boss-letters" class="boss-letters"></div>
        </div>
        <div class="boss-input-area">
          <input type="text" id="boss-word-input" placeholder="Type a word and press Enter..."
                 autocomplete="off" autocapitalize="off" spellcheck="false">
          <button id="boss-submit-btn">Submit</button>
          <button id="boss-swap-btn" class="boss-swap-btn">Swap 1→3</button>
        </div>
        <div id="boss-words-used" class="boss-words-used"></div>
      </div>
    </div>

    <!-- Boss Victory (level up) -->
    <div id="boss-victory" class="overlay hidden">
      <div class="victory-content boss-win">
        <div class="victory-title">LEVEL UP!</div>
        <div id="boss-victory-msg" class="victory-sub"></div>
        <button id="boss-next-action" class="play-again-btn-v">Next Round</button>
      </div>
    </div>

    <!-- Boss Defeat -->
    <div id="boss-defeat" class="overlay hidden">
      <div class="victory-content boss-lose">
        <div class="defeat-title">GAME OVER</div>
        <div id="boss-defeat-msg" class="victory-sub"></div>
        <button onclick="location.reload()" class="play-again-btn-v">Try Again</button>
      </div>
    </div>

    <!-- Final Victory — beat all 5 levels -->
    <div id="final-victory" class="overlay hidden">
      <div class="victory-content">
        <div class="final-victory-title">CHAMPION</div>
        <div class="victory-sub">All five levels. Conquered.</div>
      </div>
    </div>

    <!-- Final Continue → Word Rain -->
    <div id="final-continue" class="overlay hidden">
      <img src="boss.png" alt="" class="boss-reveal-img">
    </div>

    <!-- Word Rain — Endgame -->
    <div id="word-rain" class="overlay hidden">
      <div class="rain-container">
        <div class="rain-hud">
          <span>Score: <strong id="rain-score">0</strong></span>
          <span id="rain-lives">❤️❤️❤️</span>
          <span class="rain-title">WORD RAIN</span>
        </div>
        <canvas id="rain-canvas"></canvas>
        <div class="rain-input-area">
          <input type="text" id="rain-input" placeholder="Type falling words..."
                 autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
