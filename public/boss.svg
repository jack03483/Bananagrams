<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sketch">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#111" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ddd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#888" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="#0a0a0a"/>

  <!-- Scratchy texture overlay -->
  <rect width="800" height="1000" fill="#111" opacity="0.3" filter="url(#rough)"/>

  <!-- ======= THE FACE — large, centered, sketchy ======= -->
  <!-- All strokes use a rough hand-drawn feel -->

  <!-- Head shape — rough oval -->
  <ellipse cx="400" cy="400" rx="180" ry="220" fill="none" stroke="#333" stroke-width="2" filter="url(#sketch)"/>
  <ellipse cx="400" cy="400" rx="175" ry="215" fill="#0d0d0d" stroke="#222" stroke-width="1"/>

  <!-- Jaw / chin -->
  <path d="M260 440 Q280 560 400 600 Q520 560 540 440" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="2"/>

  <!-- Forehead creases -->
  <path d="M290 280 Q340 270 390 278" stroke="#2a2a2a" stroke-width="2" fill="none"/>
  <path d="M410 278 Q460 270 510 280" stroke="#2a2a2a" stroke-width="2" fill="none"/>
  <path d="M300 295 Q350 287 385 293" stroke="#222" stroke-width="1.5" fill="none"/>
  <path d="M415 293 Q450 287 500 295" stroke="#222" stroke-width="1.5" fill="none"/>

  <!-- Brow — heavy, angry, asymmetric -->
  <path d="M260 330 Q290 305 340 315 Q360 318 380 325" stroke="#3a3a3a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M420 325 Q440 318 460 315 Q510 305 540 330" stroke="#3a3a3a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Brow shadow -->
  <path d="M265 335 Q310 320 370 330" stroke="#222" stroke-width="3" fill="none"/>
  <path d="M430 330 Q490 320 535 335" stroke="#222" stroke-width="3" fill="none"/>

  <!-- Left eye socket — deep, shadowed -->
  <ellipse cx="330" cy="365" rx="40" ry="30" fill="#050505"/>
  <!-- Left eye — narrow, menacing slit -->
  <path d="M295 365 Q310 350 330 348 Q350 350 365 365" fill="#111" stroke="#444" stroke-width="1.5"/>
  <path d="M295 365 Q310 375 330 377 Q350 375 365 365" fill="#111" stroke="#444" stroke-width="1.5"/>
  <!-- Left iris — pale, dead -->
  <circle cx="330" cy="363" r="12" fill="#222"/>
  <circle cx="330" cy="363" r="8" fill="#1a1a1a"/>
  <!-- Left eye glint — the one bright point -->
  <circle cx="325" cy="358" r="3" fill="url(#eyeGlow)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Right eye socket -->
  <ellipse cx="470" cy="365" rx="40" ry="30" fill="#050505"/>
  <!-- Right eye — wider, cracked skin around it -->
  <path d="M435 365 Q450 348 470 345 Q490 348 505 365" fill="#111" stroke="#444" stroke-width="1.5"/>
  <path d="M435 365 Q450 378 470 380 Q490 378 505 365" fill="#111" stroke="#444" stroke-width="1.5"/>
  <!-- Right iris -->
  <circle cx="470" cy="363" r="12" fill="#222"/>
  <circle cx="470" cy="363" r="8" fill="#1a1a1a"/>
  <!-- Right eye — glowing, cracked -->
  <circle cx="470" cy="360" r="10" fill="url(#eyeGlow)" opacity="0.7" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Cracks radiating from right eye -->
  <path d="M482 352 L500 338 L505 340" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M480 358 L502 355 L510 350" stroke="#2a2a2a" stroke-width="1" fill="none"/>
  <path d="M478 370 L498 378 L505 375" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M460 350 L455 332 L458 325" stroke="#2a2a2a" stroke-width="1" fill="none"/>
  <path d="M475 345 L478 328 L485 318" stroke="#333" stroke-width="1" fill="none"/>

  <!-- Nose — angular, broken looking -->
  <path d="M395 370 L388 430 L378 445" stroke="#2a2a2a" stroke-width="2" fill="none"/>
  <path d="M405 370 L400 430 L410 445" stroke="#2a2a2a" stroke-width="2" fill="none"/>
  <path d="M378 445 Q394 450 410 445" stroke="#333" stroke-width="1.5" fill="none"/>

  <!-- Cheek lines — gaunt -->
  <path d="M280 380 Q290 430 300 470" stroke="#222" stroke-width="1.5" fill="none"/>
  <path d="M520 380 Q510 430 500 470" stroke="#222" stroke-width="1.5" fill="none"/>
  <path d="M285 400 Q295 440 310 475" stroke="#1a1a1a" stroke-width="1" fill="none"/>
  <path d="M515 400 Q505 440 490 475" stroke="#1a1a1a" stroke-width="1" fill="none"/>

  <!-- THE MOUTH — wide, too many teeth, grinning -->
  <path d="M300 510 Q340 490 400 495 Q460 490 500 510" fill="#050505" stroke="#333" stroke-width="2"/>
  <path d="M300 510 Q340 540 400 545 Q460 540 500 510" fill="#050505" stroke="#333" stroke-width="2"/>

  <!-- Upper teeth — jagged, uneven -->
  <path d="M310 510 L318 525 L326 508 L336 527 L346 506 L358 528 L368 507 L380 526 L392 508 L404 527 L414 506 L426 528 L436 507 L448 526 L458 508 L468 525 L476 510 L488 523 L496 510"
        fill="#1a1a18" stroke="#2a2a28" stroke-width="1"/>

  <!-- Lower teeth -->
  <path d="M315 515 L322 530 L330 515 L340 532 L350 514 L362 530 L374 515 L386 532 L398 515 L410 530 L422 515 L434 530 L446 515 L456 532 L466 515 L478 530 L490 515"
        fill="#18181a" stroke="#28282a" stroke-width="0.8"/>

  <!-- Scars / stitches across face -->
  <!-- Left cheek scar -->
  <path d="M270 350 L295 380 L285 410" stroke="#333" stroke-width="2" fill="none"/>
  <line x1="275" y1="360" x2="285" y2="355" stroke="#333" stroke-width="1"/>
  <line x1="280" y1="370" x2="290" y2="365" stroke="#333" stroke-width="1"/>
  <line x1="287" y1="385" x2="295" y2="378" stroke="#333" stroke-width="1"/>
  <line x1="285" y1="395" x2="293" y2="390" stroke="#333" stroke-width="1"/>

  <!-- Forehead scar -->
  <path d="M350 260 L370 290 L360 310" stroke="#333" stroke-width="2" fill="none"/>
  <line x1="355" y1="270" x2="365" y2="265" stroke="#333" stroke-width="1"/>
  <line x1="360" y1="280" x2="370" y2="275" stroke="#333" stroke-width="1"/>
  <line x1="367" y1="293" x2="375" y2="286" stroke="#333" stroke-width="1"/>

  <!-- Hood / cowl shape -->
  <path d="M200 250 Q180 200 200 140 Q250 60 400 40 Q550 60 600 140 Q620 200 600 250
           Q580 200 560 220 Q530 180 400 170 Q270 180 240 220 Q220 200 200 250"
        fill="#0a0a0a" stroke="#222" stroke-width="2"/>
  <!-- Hood stitching -->
  <path d="M400 40 Q398 80 400 120 Q402 150 400 170" stroke="#222" stroke-width="2" fill="none"/>
  <line x1="395" y1="60" x2="405" y2="60" stroke="#222" stroke-width="1"/>
  <line x1="394" y1="80" x2="406" y2="80" stroke="#222" stroke-width="1"/>
  <line x1="395" y1="100" x2="405" y2="100" stroke="#222" stroke-width="1"/>
  <line x1="394" y1="120" x2="406" y2="120" stroke="#222" stroke-width="1"/>
  <line x1="395" y1="140" x2="405" y2="140" stroke="#222" stroke-width="1"/>

  <!-- Hood edges — tattered -->
  <path d="M200 250 Q210 260 205 275 Q215 270 220 285" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <path d="M600 250 Q590 260 595 275 Q585 270 580 285" stroke="#1a1a1a" stroke-width="2" fill="none"/>

  <!-- Shoulder hints -->
  <path d="M220 285 Q200 350 180 450" stroke="#1a1a1a" stroke-width="3" fill="none"/>
  <path d="M580 285 Q600 350 620 450" stroke="#1a1a1a" stroke-width="3" fill="none"/>
  <path d="M180 450 Q150 500 120 580" stroke="#111" stroke-width="2" fill="none"/>
  <path d="M620 450 Q650 500 680 580" stroke="#111" stroke-width="2" fill="none"/>

  <!-- Neck/collar stitched -->
  <path d="M300 600 Q350 610 400 615 Q450 610 500 600" stroke="#222" stroke-width="2" fill="none"/>
  <path d="M340 600 L345 615" stroke="#222" stroke-width="1"/>
  <path d="M360 605 L365 618" stroke="#222" stroke-width="1"/>
  <path d="M380 608 L383 620" stroke="#222" stroke-width="1"/>
  <path d="M420 608 L417 620" stroke="#222" stroke-width="1"/>
  <path d="M440 605 L435 618" stroke="#222" stroke-width="1"/>
  <path d="M460 600 L455 615" stroke="#222" stroke-width="1"/>

  <!-- Vignette overlay -->
  <rect width="800" height="1000" fill="url(#vignette)"/>

  <!-- ======= CONTINUE? text ======= -->
  <text x="400" y="820" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="90" font-weight="900" fill="#fff" letter-spacing="12"
        filter="url(#glow)" opacity="0.9">CONTINUE?</text>

  <!-- Subtle scratches around text -->
  <line x1="120" y1="835" x2="180" y2="833" stroke="#333" stroke-width="1" opacity="0.4"/>
  <line x1="620" y1="830" x2="680" y2="835" stroke="#333" stroke-width="1" opacity="0.4"/>
  <line x1="140" y1="800" x2="160" y2="805" stroke="#222" stroke-width="0.8" opacity="0.3"/>
  <line x1="640" y1="805" x2="660" y2="800" stroke="#222" stroke-width="0.8" opacity="0.3"/>
</svg>
