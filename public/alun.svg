<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="dust">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0800"/>
      <stop offset="40%" stop-color="#2a1005"/>
      <stop offset="70%" stop-color="#3a1808"/>
      <stop offset="100%" stop-color="#1a0a02"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="30%" r="25%">
      <stop offset="0%" stop-color="#cc6622" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#883311" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#441100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a02"/>
      <stop offset="100%" stop-color="#0a0400"/>
    </linearGradient>
    <linearGradient id="cloakGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="500" fill="url(#skyGrad)"/>

  <!-- Dying sun / blood moon -->
  <circle cx="200" cy="135" r="70" fill="#1a0800"/>
  <circle cx="200" cy="135" r="68" fill="#221000" opacity="0.8"/>
  <circle cx="200" cy="135" r="60" fill="#331505" opacity="0.6"/>
  <circle cx="200" cy="135" r="68" fill="none" stroke="#663310" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="135" r="72" fill="none" stroke="#442208" stroke-width="0.5" opacity="0.3"/>
  <!-- Sun corona -->
  <circle cx="200" cy="135" r="80" fill="url(#sunGrad)"/>
  <circle cx="200" cy="135" r="55" fill="#2a1005" opacity="0.3"/>
  <!-- Sun surface detail -->
  <circle cx="185" cy="120" r="8" fill="#3a1808" opacity="0.4"/>
  <circle cx="210" cy="145" r="12" fill="#2a1005" opacity="0.3"/>
  <circle cx="195" cy="150" r="6" fill="#3a1808" opacity="0.3"/>

  <!-- Atmospheric haze -->
  <ellipse cx="200" cy="350" rx="250" ry="60" fill="#2a1005" opacity="0.2" filter="url(#haze)"/>

  <!-- Ground plane -->
  <path d="M0 380 Q100 370 200 375 Q300 370 400 380 L400 500 L0 500Z" fill="url(#groundGrad)"/>
  <path d="M0 385 Q80 378 160 382 Q240 378 320 383 Q360 380 400 385" stroke="#2a1005" stroke-width="0.5" fill="none" opacity="0.4"/>

  <!-- Distant dust -->
  <ellipse cx="80" cy="360" rx="40" ry="8" fill="#2a1005" opacity="0.15" filter="url(#dust)"/>
  <ellipse cx="320" cy="365" rx="35" ry="6" fill="#2a1005" opacity="0.12" filter="url(#dust)"/>

  <!-- ====== THE FIGURE — ALUN ====== -->

  <!-- Shadow on ground -->
  <ellipse cx="200" cy="410" rx="55" ry="8" fill="#000" opacity="0.6" filter="url(#dust)"/>

  <!-- Cloak — the main mass, tattered, flowing -->
  <!-- Wide base, tattered edges -->
  <path d="M148 180
           Q142 220 138 270
           Q134 310 128 350
           Q124 370 118 390
           L122 395 L128 388 L132 397 L138 390 L142 400 L148 392
           L154 402 L160 393 L168 400 L175 390
           Q185 395 200 398
           Q215 395 225 390
           L232 400 L240 393 L246 402 L252 392
           L258 400 L262 390 L268 397 L272 388 L278 395 L282 390
           Q276 370 272 350
           Q266 310 262 270
           Q258 220 252 180
           Q240 160 200 155
           Q160 160 148 180Z"
        fill="url(#cloakGrad)"/>

  <!-- Cloak folds — dark lines suggesting heavy fabric -->
  <path d="M165 200 Q162 260 155 330 Q152 360 148 392" stroke="#111" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M180 185 Q178 250 174 320 Q170 360 168 400" stroke="#0a0a0a" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M200 165 Q200 250 200 340 Q200 370 200 398" stroke="#0a0a0a" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M220 185 Q222 250 226 320 Q230 360 232 400" stroke="#0a0a0a" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M235 200 Q238 260 245 330 Q248 360 252 392" stroke="#111" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Subtle wind-caught fabric on the right -->
  <path d="M262 300 Q275 290 285 300 Q278 310 270 315" fill="#080808" opacity="0.7"/>
  <path d="M268 330 Q282 322 290 335 Q280 342 272 345" fill="#060606" opacity="0.6"/>

  <!-- Hood -->
  <path d="M155 180
           Q150 160 158 140
           Q170 115 200 108
           Q230 115 242 140
           Q250 160 245 180
           Q235 190 200 195
           Q165 190 155 180Z"
        fill="#080808" stroke="#111" stroke-width="0.5"/>

  <!-- Hood depth — inner shadow -->
  <path d="M162 175
           Q160 158 166 142
           Q176 122 200 116
           Q224 122 234 142
           Q240 158 238 175
           Q230 183 200 187
           Q170 183 162 175Z"
        fill="#030303"/>

  <!-- The void inside the hood — pure black -->
  <ellipse cx="200" cy="155" rx="28" ry="25" fill="#010101"/>

  <!-- Eyes — just two dim embers in the dark -->
  <ellipse cx="188" cy="152" rx="4" ry="2.5" fill="#882200" filter="url(#glow)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="212" cy="152" rx="4" ry="2.5" fill="#882200" filter="url(#glow)" opacity="0.9">
    <animate attributeName="opacity" values="0.7;0.9;0.7" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Pinpoint pupils -->
  <ellipse cx="188" cy="152" rx="1.5" ry="1" fill="#cc4400" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.6;1" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="212" cy="152" rx="1.5" ry="1" fill="#cc4400" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Drifting particles / embers rising from the figure -->
  <circle cx="175" cy="300" r="1.2" fill="#aa3300" opacity="0" filter="url(#dust)">
    <animate attributeName="cy" values="300;180;100" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="175;170;168" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="320" r="0.8" fill="#993300" opacity="0" filter="url(#dust)">
    <animate attributeName="cy" values="320;200;120" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="220;225;222" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="195" cy="350" r="1" fill="#884400" opacity="0" filter="url(#dust)">
    <animate attributeName="cy" values="350;220;130" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.3;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="195;190;192" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="210" cy="280" r="0.7" fill="#aa4400" opacity="0" filter="url(#dust)">
    <animate attributeName="cy" values="280;160;80" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="185" cy="250" r="0.9" fill="#773300" opacity="0" filter="url(#dust)">
    <animate attributeName="cy" values="250;140;60" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="185;182;180" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Name — understated, etched -->
  <text x="200" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="20" font-weight="400" fill="#442211" letter-spacing="12" opacity="0.7">ALUN</text>
</svg>
